name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt
    - name: Run tests
      run: python -m pytest -q
    - name: Dry run against the fixture
      run: python weekly_recap.py --fixture tests/fixtures/week.json --no-ai --dry-run > /dev/null
