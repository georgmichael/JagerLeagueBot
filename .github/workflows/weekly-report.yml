name: Weekly report

on:
  schedule:
    # Tuesdays at 1 a.m. Eastern, after Monday Night Football. Cron runs in UTC, so there's one entry for daylight
    # time (05:00 UTC) and one for standard time (06:00 UTC); the job skips whichever doesn't match today's offset.
    # Off the top of the hour because GitHub delays or drops scheduled runs most often then.
    - cron: "7 5 * * 2"
    - cron: "7 6 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to report on (blank for the last completed week)"
        required: false
      dry_run:
        description: "Print the recap in the log instead of posting to Discord"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # GitHub's maximum; the retry loop below gives up a little before this
    timeout-minutes: 360

    steps:
    - name: Skip the schedule entry for the other half of the year
      id: gate
      env:
        SCHEDULE: ${{ github.event.schedule }}
      run: |
        # Decide by the entry that fired, not the clock, so a run GitHub starts late still goes ahead
        if [ -n "$SCHEDULE" ] && [ "$(TZ=America/New_York date +%z)" = "-0400" ] && [ "$SCHEDULE" != "7 5 * * 2" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$SCHEDULE" ] && [ "$(TZ=America/New_York date +%z)" = "-0500" ] && [ "$SCHEDULE" != "7 6 * * 2" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@v4
      if: ${{ !steps.gate.outputs.skip }}
    - name: Set up Python
      if: ${{ !steps.gate.outputs.skip }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      if: ${{ !steps.gate.outputs.skip }}
      run: pip install -r requirements.txt
    - name: Post report to Discord
      if: ${{ !steps.gate.outputs.skip }}
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        LLM_MODEL: ${{ vars.LLM_MODEL }}
        IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        WEEK: ${{ inputs.week }}
        DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
      # Retry every 15 minutes until the model writes the recap, rather than posting the plain summary.
      # After 22 tries (about 5.5 hours) the job fails and nothing is posted.
      run: |
        for attempt in $(seq 1 22); do
          python weekly_report.py ${WEEK:+--week "$WEEK"} $DRY_RUN --no-fallback && exit 0
          echo "Attempt $attempt failed, retrying in 15 minutes"
          sleep 900
        done
        echo "Giving up: the model never wrote the recap"
        exit 1
    - name: Upload dry-run manga
      if: ${{ always() && inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: manga
        path: manga/
        if-no-files-found: ignore
