name: Weekly report

on:
  schedule:
    # Tuesdays at 07:00 UTC: 2 a.m. Eastern in standard time (3 a.m. during daylight time), after Monday Night Football
    - cron: "0 7 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to report on (blank for the last completed week)"
        required: false
      dry_run:
        description: "Print the recap in the log instead of posting to Discord"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # GitHub's maximum; the retry loop below gives up a little before this
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Post report to Discord
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        LLM_MODEL: ${{ vars.LLM_MODEL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        WEEK: ${{ inputs.week }}
        DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
      # Retry every 15 minutes until the model writes the recap, rather than posting the plain summary.
      # After 22 tries (about 5.5 hours) the job fails and nothing is posted.
      run: |
        for attempt in $(seq 1 22); do
          python weekly_report.py ${WEEK:+--week "$WEEK"} $DRY_RUN --no-fallback && exit 0
          echo "Attempt $attempt failed, retrying in 15 minutes"
          sleep 900
        done
        echo "Giving up: the model never wrote the recap"
        exit 1
